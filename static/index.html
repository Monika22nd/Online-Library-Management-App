<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online Library</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .book-card { transition: transform 0.2s; cursor: pointer; }
    .book-card:hover { transform: translateY(-5px); }
    .book-cover { height: 200px; object-fit: cover; }
    .book-detail-cover { max-height: 400px; }
    .nav-link { cursor: pointer; }
    .cart-badge { position: relative; top: -10px; left: -10px; }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="#">📚 Online Library</a>
      <div class="navbar-nav ms-auto">
        <a class="nav-link" onclick="showPage('home')">Home</a>
        <a class="nav-link" onclick="showPage('cart')">Cart <span id="cartCount" class="badge bg-danger">0</span></a>
        <a class="nav-link" onclick="showPage('loans')">My Loans</a>
        <a class="nav-link" onclick="showPage('login')">Login</a>
      </div>
    </div>
  </nav>

  <div class="container my-4">
    <!-- Home Page -->
    <div id="page-home">
      <div class="row mb-4">
        <div class="col-md-8">
          <input type="text" id="searchInput" class="form-control" placeholder="Search books..." onkeyup="if(event.key==='Enter')searchBooks()">
        </div>
        <div class="col-md-4">
          <button class="btn btn-primary" onclick="searchBooks()">Search</button>
          <button class="btn btn-success" onclick="importBooks()">Import from OpenLibrary</button>
        </div>
      </div>
      <div id="booksGrid" class="row"></div>
    </div>

    <!-- Book Detail Page -->
    <div id="page-detail" style="display:none;">
      <button class="btn btn-secondary mb-3" onclick="showPage('home')">← Back</button>
      <div class="row">
        <div class="col-md-4">
          <img id="detailCover" class="img-fluid rounded" src="" alt="Cover">
        </div>
        <div class="col-md-8">
          <h2 id="detailTitle"></h2>
          <h5 id="detailAuthor" class="text-muted"></h5>
          <p class="mt-3"><strong>ISBN:</strong> <span id="detailIsbn"></span></p>
          <p><strong>Published:</strong> <span id="detailYear"></span></p>
          <p><strong>Subjects:</strong> <span id="detailSubjects"></span></p>
          <p><strong>Available:</strong> <span id="detailAvailable"></span> / <span id="detailTotal"></span></p>
          <hr>
          <h5>Description</h5>
          <p id="detailDescription"></p>
          <button class="btn btn-primary btn-lg" onclick="addToCartFromDetail()">Add to Cart</button>
        </div>
      </div>
    </div>

    <!-- Cart Page -->
    <div id="page-cart" style="display:none;">
      <h2>My Cart</h2>
      <div id="cartItems" class="row"></div>
      <button class="btn btn-success btn-lg mt-3" onclick="checkout()">Checkout</button>
    </div>

    <!-- Loans Page -->
    <div id="page-loans" style="display:none;">
      <h2>My Loans</h2>
      <ul class="nav nav-tabs mb-3">
        <li class="nav-item"><a class="nav-link active" onclick="filterLoans('PENDING')">Pending</a></li>
        <li class="nav-item"><a class="nav-link" onclick="filterLoans('APPROVED')">Approved</a></li>
        <li class="nav-item"><a class="nav-link" onclick="filterLoans('RETURNED')">Returned</a></li>
      </ul>
      <div id="loansList"></div>
    </div>

    <!-- Login Page -->
    <div id="page-login" style="display:none;">
      <div class="row justify-content-center">
        <div class="col-md-4">
          <div class="card">
            <div class="card-body">
              <h3 class="text-center">Login</h3>
              <input type="text" id="loginUsername" class="form-control mb-2" placeholder="Username">
              <input type="password" id="loginPassword" class="form-control mb-2" placeholder="Password">
              <button class="btn btn-primary w-100" onclick="login()">Login</button>
              <hr>
              <h4>Register</h4>
              <input type="text" id="regUsername" class="form-control mb-2" placeholder="Username">
              <input type="password" id="regPassword" class="form-control mb-2" placeholder="Password">
              <input type="email" id="regEmail" class="form-control mb-2" placeholder="Email">
              <button class="btn btn-secondary w-100" onclick="register()">Register</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="/static/api.js"></script>
  <script>
    let currentUser = null;
    let currentBook = null;
    let currentPage = 'home';

    async function init() {
      loadBooks();
    }

    function showPage(page) {
      document.querySelectorAll('[id^="page-"]').forEach(el => el.style.display = 'none');
      document.getElementById('page-' + page).style.display = page === 'detail' ? 'none' : (page === 'home' ? '' : 'block');
      if (page === 'home') {
        document.getElementById('page-home').style.display = '';
      }
      currentPage = page;
    }

    async function loadBooks() {
      try {
        const books = await API.books.list(50);
        renderBooks(books);
      } catch (e) {
        console.error(e);
      }
    }

    function renderBooks(books) {
      const grid = document.getElementById('booksGrid');
      grid.innerHTML = books.map(book => `
        <div class="col-md-3 mb-3">
          <div class="card book-card h-100" onclick="viewBook(${book.id})">
            <img src="${book.cover_url || '/static/no-cover.png'}" class="card-img-top book-cover" alt="${book.title}">
            <div class="card-body">
              <h6 class="card-title">${book.title}</h6>
              <p class="card-text small text-muted">${book.author}</p>
              <p class="card-text"><span class="badge bg-${book.available_copies > 0 ? 'success' : 'danger'}">${book.available_copies}/${book.total_copies}</span></p>
            </div>
          </div>
        </div>
      `).join('');
    }

    async function searchBooks() {
      const query = document.getElementById('searchInput').value;
      if (query) {
        const books = await API.books.search(query);
        renderBooks(books);
      } else {
        loadBooks();
      }
    }

    async function importBooks() {
      const result = await API.books.import("programming", 50);
      alert(`Imported ${result.saved} books`);
      loadBooks();
    }

    async function viewBook(id) {
      const book = await API.books.get(id);
      currentBook = book;
      
      document.getElementById('page-home').style.display = 'none';
      document.getElementById('page-detail').style.display = '';
      
      document.getElementById('detailCover').src = book.cover_url || '/static/no-cover.png';
      document.getElementById('detailTitle').textContent = book.title;
      document.getElementById('detailAuthor').textContent = book.author;
      document.getElementById('detailIsbn').textContent = book.isbn || 'N/A';
      document.getElementById('detailYear').textContent = book.publish_year || 'N/A';
      document.getElementById('detailSubjects').textContent = book.subjects || 'N/A';
      document.getElementById('detailAvailable').textContent = book.available_copies;
      document.getElementById('detailTotal').textContent = book.total_copies;
      document.getElementById('detailDescription').textContent = book.description || 'No description available.';
    }

    async function addToCartFromDetail() {
      if (!currentUser) {
        alert('Please login first');
        showPage('login');
        return;
      }
      await API.cart.add(currentBook.id, currentUser.id);
      alert('Added to cart!');
      updateCartCount();
    }

    async function addToCart(bookId) {
      if (!currentUser) {
        alert('Please login first');
        showPage('login');
        return;
      }
      await API.cart.add(bookId, currentUser.id);
      updateCartCount();
    }

    async function updateCartCount() {
      if (currentUser) {
        const cart = await API.cart.get(currentUser.id);
        document.getElementById('cartCount').textContent = cart.length;
      }
    }

    async function loadCart() {
      if (!currentUser) return;
      const cart = await API.cart.get(currentUser.id);
      const grid = document.getElementById('cartItems');
      grid.innerHTML = cart.map(book => `
        <div class="col-md-3 mb-3">
          <div class="card h-100">
            <img src="${book.cover_url || '/static/no-cover.png'}" class="card-img-top book-cover" alt="${book.title}">
            <div class="card-body">
              <h6>${book.title}</h6>
              <p class="text-muted">${book.author}</p>
            </div>
          </div>
        </div>
      `).join('');
    }

    async function checkout() {
      if (!currentUser) {
        alert('Please login first');
        return;
      }
      const result = await API.cart.checkout(currentUser.id);
      alert('Checkout successful!');
      updateCartCount();
      showPage('loans');
    }

    async function login() {
      const username = document.getElementById('loginUsername').value;
      const password = document.getElementById('loginPassword').value;
      const result = await API.auth.login({ username, password });
      if (result.access_token) {
        currentUser = result.user;
        alert('Logged in as ' + currentUser.username);
        updateCartCount();
        showPage('home');
      } else {
        alert('Login failed');
      }
    }

    async function register() {
      const username = document.getElementById('regUsername').value;
      const password = document.getElementById('regPassword').value;
      const email = document.getElementById('regEmail').value;
      const result = await API.auth.register({ username, password, email });
      alert('Registered! Please login.');
    }

    async function filterLoans(status) {
      if (!currentUser) return;
      const loans = await API.loans.user(currentUser.id, status);
      const list = document.getElementById('loansList');
      list.innerHTML = loans.map(loan => `
        <div class="card mb-2">
          <div class="card-body">
            <div class="row">
              <div class="col-md-2">
                <img src="${loan.cover_url || '/static/no-cover.png'}" class="img-fluid" style="height:80px;object-fit:cover;">
              </div>
              <div class="col-md-8">
                <h5>${loan.title}</h5>
                <p class="mb-1">Status: <span class="badge bg-${status==='APPROVED'?'success':status==='PENDING'?'warning':'secondary'}">${loan.status}</span></p>
                <p class="mb-1">Requested: ${loan.request_date}</p>
                ${loan.borrow_date ? `<p class="mb-1">Due: ${loan.due_date}</p>` : ''}
              </div>
              <div class="col-md-2">
                ${loan.status === 'APPROVED' ? `<button class="btn btn-primary btn-sm" onclick="returnLoan(${loan.id})">Return</button>` : ''}
              </div>
            </div>
          </div>
        </div>
      `).join('');
    }

    async function returnLoan(loanId) {
      await API.loans.return(loanId);
      filterLoans('APPROVED');
    }

    init();
  </script>
</body>
</html>
